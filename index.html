<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A chibi cha chaan teng catching game.">
<title>Cha Chaan Catch</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: one-screen column. The stage holds the game canvas and the waiter designer overlay.
   A control strip sits below. Palette is pastel kawaii: cream, blush, mint, lavender, powder blue,
   with a single coral accent. Display face is Fredoka for its round, friendly shapes. */
:root {
  --bg: #f6ecef;
  --stage: #e8f2ef;
  --ink: #5b4a58;
  --muted: #8a7a88;
  --btn: #d3e6f0;
  --btn-on: #b7d5e8;
  --accent: #cf6a60;
  --card: #fff8f6;
  --line: #ead7d9;
  --f-display: "Fredoka", "Baloo 2", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; }
body {
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font: 600 14px/1.3 var(--f-display);
  padding-inline: 16px;
  padding-block: 8px;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}
#app { height: 100%; display: flex; flex-direction: column; gap: 8px; }
#stage { position: relative; flex: 1 1 0; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
#c { display: block; width: 240px; height: 360px; border-radius: 14px; background: var(--stage); touch-action: none; }

#maker {
  position: absolute; inset: 0; overflow: hidden;
  background: linear-gradient(180deg, #fff8f6, #fdeeee);
  border-radius: 14px;
  touch-action: pan-y;
}
#maker .inner {
  height: 100%; max-width: 760px; margin-inline: auto; padding: 12px 14px 14px;
  display: grid; gap: 12px; align-content: start;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto auto minmax(0, 1fr) auto;
  grid-template-areas: "head" "pv" "panel" "act";
}
#maker header { grid-area: head; position: relative; padding-inline: 64px; text-align: center; display: flex; flex-direction: column; gap: 2px; }
#maker h1 { margin: 0; font: 700 26px/1.05 var(--f-display); color: var(--ink); text-wrap: balance; }
#maker .sub { font: 500 13px var(--f-display); color: var(--muted); }
#back { position: absolute; left: 0; top: 0; min-height: 36px; padding: 0 10px; border: 0; background: none; color: var(--muted); font: 600 15px var(--f-display); cursor: pointer; }
#back:hover { color: var(--ink); }
#pv {
  grid-area: pv; justify-self: center; display: block;
  width: min(100%, 250px, 29vh * 1.043); aspect-ratio: 240 / 230; height: auto;
  border-radius: 24px; background: var(--stage); box-shadow: 0 6px 18px rgba(150,110,120,.16);
}
#panel { grid-area: panel; display: flex; flex-direction: column; gap: 14px; min-height: 0; min-width: 0; }
#tabs { display: flex; gap: 2px; padding: 3px; background: #f4e6e6; border-radius: 999px; flex: none; }
.tab {
  flex: 1 1 0; min-width: 0; min-height: 38px; padding: 4px 0; border: 0; border-radius: 999px; background: none;
  color: var(--muted); font: 600 14px var(--f-display); cursor: pointer; white-space: nowrap;
}
.tab[aria-selected="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(150,110,120,.2); }
#rows { display: flex; flex-direction: column; gap: 16px; overflow-y: auto; min-height: 0; padding: 2px; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
.row { display: flex; flex-direction: column; gap: 8px; }
.lab { font: 600 11px var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-height: 38px; padding: 4px 14px; border-radius: 999px;
  border: 0; background: #f7eded; color: var(--ink);
  font: 600 14px var(--f-display); cursor: pointer;
}
.chip:hover { background: #f1e1e1; }
.chip[aria-pressed="true"] { background: var(--accent); color: #fff; }
.sw {
  width: 40px; height: 40px; border-radius: 50%; padding: 0; cursor: pointer;
  border: 3px solid #fff; box-shadow: 0 0 0 1.5px var(--line);
}
.sw[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--accent); }
.chip:focus-visible, .sw:focus-visible, .tab:focus-visible, #go:focus-visible, #shuffle:focus-visible, #back:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
#actions { grid-area: act; display: flex; align-items: center; gap: 12px; }
#shuffle {
  flex: none; min-height: 48px; padding: 0 6px; border: 0; background: none; color: var(--muted); cursor: pointer;
  font: 600 14px var(--f-display); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line);
}
#shuffle:hover { color: var(--ink); }
#go {
  flex: 1; min-height: 50px; border: 0; border-radius: 16px;
  background: var(--accent); color: #fff; font: 700 18px var(--f-display); cursor: pointer;
  box-shadow: 0 4px 0 #b4554c;
}
#go:active { transform: translateY(2px); box-shadow: 0 2px 0 #b4554c; }
@media (max-height: 700px) { #maker .sub { display: none; } }
@media (min-width: 640px) {
  #maker .inner {
    grid-template-columns: minmax(200px, 38%) minmax(0, 1fr);
    grid-template-rows: auto auto minmax(0, 1fr);
    grid-template-areas: "head head" "pv panel" "act panel";
    column-gap: 28px; align-content: center;
  }
  #pv { width: min(100%, 300px); align-self: start; }
  #actions { flex-direction: column; align-items: stretch; align-self: start; gap: 6px; }
  #go { flex: none; }
  #shuffle { min-height: 36px; }
}

#pad { display: flex; gap: 10px; height: 64px; flex: none; }
#pad button {
  flex: 1; min-width: 0; border: 0; border-radius: 16px;
  background: var(--btn); color: var(--ink);
  font: 700 26px var(--f-display); cursor: pointer; touch-action: none;
}
#pad button#bW { flex: 1.4; font-size: 17px; }
#pad button.on { background: var(--btn-on); }
#pad button:disabled { opacity: .45; cursor: default; }
#pad button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>

<div id="app">
  <div id="stage">
    <canvas id="c"></canvas>
    <section id="maker" aria-label="Design your waiter">
      <div class="inner">
        <header>
          <button id="back" type="button">&lsaquo; Back</button>
          <h1>Your waiter</h1>
          <span class="sub">Pick a look, then start serving</span>
        </header>
        <canvas id="pv"></canvas>
        <div id="panel">
          <div id="tabs" role="tablist"></div>
          <div id="rows"></div>
        </div>
        <div id="actions">
          <button id="shuffle" type="button">Surprise me</button>
          <button id="go" type="button">Start serving</button>
        </div>
      </div>
    </section>
  </div>
  <div id="pad">
    <button id="bL" aria-label="Move left">&larr;</button>
    <button id="bW" type="button">Waiter</button>
    <button id="bR" aria-label="Move right">&rarr;</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
(function () {
"use strict";
const M = Matter, Engine = M.Engine, Bodies = M.Bodies, Body = M.Body,
      Composite = M.Composite, Events = M.Events, Vector = M.Vector, Constraint = M.Constraint;

const W = 480, H = 720;
const DPR = Math.min(window.devicePixelRatio || 1, 3);
const cv = document.getElementById('c');
let ctx = cv.getContext('2d');
cv.width = W * DPR; cv.height = H * DPR;
const pv = document.getElementById('pv');
const pctx = pv.getContext('2d');
const PVW = 240, PVH = 230;
pv.width = PVW * DPR; pv.height = PVH * DPR;
const stageEl = document.getElementById('stage');
function fit() {
  const s = Math.min(stageEl.clientWidth / W, stageEl.clientHeight / H);
  if (!(s > 0)) return;
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
}
window.addEventListener('resize', fit);
fit();

/* ---------- Palette and type ---------- */
const C = {
  ink: '#5b4a58', out: '#9b8398', skin: '#fbdcc4', hair: '#7a6a80',
  cream: '#fffaf3', wood: '#e8c9ae', woodDark: '#d3b090', coral: '#f2a9a0', rose: '#f6b8c6',
  mint: '#a8d8cf', mintDeep: '#8fc2b8', sky: '#a9cfe8', lav: '#cdbbf0', butter: '#fbe48a', tea: '#d9a77c'
};
const F = function (w, s) { return w + ' ' + s + 'px "Fredoka","Baloo 2",system-ui,sans-serif'; };
const FCJK = function (w, s) { return w + ' ' + s + 'px "PingFang HK","Noto Sans HK","Microsoft JhengHei","Noto Sans TC","Hiragino Sans",sans-serif'; };
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const t = amt < 0 ? 0 : 255, p = Math.abs(amt);
  r = Math.round(r + (t - r) * p); g = Math.round(g + (t - g) * p); b = Math.round(b + (t - b) * p);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); }
function outlined(text, x, y, color) {
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineJoin = 'round';
  ctx.strokeText(text, x, y);
  ctx.fillStyle = color; ctx.fillText(text, x, y);
}

/* ---------- Waiter look (saved per viewer) ---------- */
const OPTS = {
  gender: [['girl', 'Girl'], ['boy', 'Boy'], ['neutral', 'Gender neutral']],
  hair: [['short', 'Short hair'], ['long', 'Long hair']],
  expr: [['smile', 'Smile'], ['beam', 'Beaming'], ['calm', 'Calm'], ['wink', 'Cheeky'], ['determined', 'Determined'],
         ['sleepy', 'Sleepy'], ['surprised', 'Surprised'], ['shy', 'Shy'], ['cool', 'Cool'], ['starry', 'Starry eyed'], ['cat', 'Cat smile']],
  outfit: [['classic', 'Classic'], ['teahouse', 'Tea house'], ['vest', 'Striped vest'], ['apron', 'Kitchen apron'],
           ['hoodie', 'Hoodie'], ['overalls', 'Overalls'], ['cheongsam', 'Cheongsam'], ['chef', 'Chef coat']],
  hat: [['none', 'No hat'], ['beret', 'Beret'], ['bucket', 'Bucket hat'], ['chef', 'Chef hat']]
};
const SWATCHES = {
  color: [['rose', 'Rose', '#f6b8c6'], ['peach', 'Peach', '#fbc9a8'], ['butter', 'Butter', '#fbe48a'], ['mint', 'Mint', '#a8d8cf'],
          ['sky', 'Sky', '#a9cfe8'], ['lavender', 'Lavender', '#cdbbf0'], ['cream', 'Cream', '#fffaf3']],
  pants: [['slate', 'Slate', '#8d8aa8'], ['denim', 'Denim', '#9fb3d1'], ['cream', 'Cream', '#fff3e6'], ['peach', 'Peach', '#f3d9c4'],
          ['rose', 'Rose', '#f6b8c6'], ['mint', 'Mint', '#bfe3d8'], ['charcoal', 'Charcoal', '#6f6678']]
};
const LABELS = { gender: 'Style', hair: 'Hair', expr: 'Expression', outfit: 'Outfit', hat: 'Hat', color: 'Clothes colour', pants: 'Trousers' };
const ROW_ORDER = ['gender', 'hair', 'expr', 'outfit', 'hat', 'color', 'pants'];
const look = { gender: 'girl', hair: 'long', expr: 'smile', outfit: 'classic', hat: 'none', color: 'mint', pants: 'slate' };
function validValue(key, val) {
  if (OPTS[key]) return OPTS[key].some(function (o) { return o[0] === val; });
  return SWATCHES[key].some(function (o) { return o[0] === val; });
}
function colorOf(group, key) {
  const f = SWATCHES[group].filter(function (o) { return o[0] === key; })[0];
  return f ? f[2] : SWATCHES[group][0][2];
}
try {
  const saved = JSON.parse(localStorage.getItem('chacatch-look') || 'null');
  if (saved) ROW_ORDER.forEach(function (k) { if (validValue(k, saved[k])) look[k] = saved[k]; });
} catch (e) {}
function saveLook() { try { localStorage.setItem('chacatch-look', JSON.stringify(look)); } catch (e) {} }

/* ---------- Tuning ---------- */
const T = {
  total: 50,
  maxSpeed: 4.5,
  accel: 0.4,
  decel: 0.3,
  gravityScale: 0.00035,
  airFriction: 0.02,
  plateY: 540,
  plateW: 200,
  spawnStart: 1.6,
  spawnMin: 0.9,
  rampSeconds: 40,
  teaSplashSpeed: 5,
  teaTilt: 1.2
};
const KINDS = { bun: { weight: 30 }, tart: { weight: 25 }, toast: { weight: 25 }, tea: { weight: 20 } };

/* ---------- Physics world ---------- */
const engine = Engine.create({ positionIterations: 10, velocityIterations: 8 });
engine.gravity.y = 1;
engine.gravity.scale = T.gravityScale;
const world = engine.world;
const DT = 1000 / 60;
const GA = engine.gravity.y * engine.gravity.scale * DT * DT;

const LIP = { r: 26, up: 14, t: 10 };   // curved end: r = horizontal run, up = rise, t = thickness
let plate, plateY0;
(function makePlate() {
  const po = { friction: 1, frictionStatic: 3, restitution: 0 };
  const hw = T.plateW / 2;
  const parts = [Bodies.rectangle(W / 2, T.plateY, T.plateW - 2 * LIP.r, 10, po)];
  [-1, 1].forEach(function (sd) {
    const P0 = { x: hw - LIP.r, y: 0 }, C1 = { x: hw - 5, y: 0 }, P2 = { x: hw - 5, y: -LIP.up };
    let prev = P0;
    for (let i = 1; i <= 3; i++) {
      const t = i / 3, u = 1 - t;
      const q = { x: u * u * P0.x + 2 * u * t * C1.x + t * t * P2.x, y: u * u * P0.y + 2 * u * t * C1.y + t * t * P2.y };
      const dx = q.x - prev.x, dy = q.y - prev.y, len = Math.hypot(dx, dy);
      const mx = W / 2 + sd * (prev.x + q.x) / 2, my = T.plateY + (prev.y + q.y) / 2;
      parts.push(Bodies.rectangle(mx, my, len + LIP.t, LIP.t, Object.assign({ angle: Math.atan2(dy, sd * dx) }, po)));
      prev = q;
    }
  });
  plate = Body.create({ parts: parts, friction: 1, frictionStatic: 3, restitution: 0, label: 'plate' });
  Body.setMass(plate, 2000);
  Body.setInertia(plate, Infinity);
  plateY0 = plate.position.y;
  Composite.add(world, plate);
})();

/* ---------- State ---------- */
const makerEl = document.getElementById('maker');
const btnW = document.getElementById('bW');
let state = 'title';            // title | create | play | over
let items = [], drops = [], puddles = [], pops = [];
let spawned = 0, finalCount = 0, elapsed = 0, spawnT = 90, settleT = 0, sinceLast = 0;
let stepCount = 0, pvx = 0, overAt = 0, titleAt = 0, best = 0;
const keys = { left: false, right: false };
try { best = parseInt(localStorage.getItem('chacatch-best2') || '0', 10) || 0; } catch (e) {}

function setState(s) { state = s; btnW.disabled = (s === 'play'); }
function reset() {
  for (const b of items) removeItem(b);
  welded.clear(); pendingWelds.length = 0;
  items = []; drops = []; puddles = []; pops = [];
  spawned = 0; finalCount = 0; elapsed = 0; spawnT = 90; settleT = 0; sinceLast = 0;
}
function start() { reset(); makerEl.hidden = true; setState('play'); }
function openMaker() {
  if (state === 'play') return;
  keys.left = false; keys.right = false;
  makerEl.hidden = false; setState('create');
}
function toTitle() {
  keys.left = false; keys.right = false;
  makerEl.hidden = true; titleAt = performance.now(); setState('title');
}
function finish() {
  setState('over'); overAt = performance.now();
  finalCount = 0;
  for (const b of items) if (b.caught) finalCount++;
  if (finalCount > best) { best = finalCount; try { localStorage.setItem('chacatch-best2', String(best)); } catch (e) {} }
}
function anyStart() {
  const now = performance.now();
  if (state === 'over' && now - overAt > 600) start();
  else if (state === 'title' && now - titleAt > 300) start();
}

/* ---------- Items ---------- */
function pickKind() {
  let total = 0;
  for (const k in KINDS) total += KINDS[k].weight;
  let r = Math.random() * total;
  for (const k in KINDS) { r -= KINDS[k].weight; if (r <= 0) return k; }
  return 'bun';
}
function make(kind, x, y) {
  const o = { friction: 1, frictionStatic: 2.5, frictionAir: T.airFriction, restitution: 0.02, label: 'item' };
  let b;
  if (kind === 'bun') b = Bodies.circle(x, y, 23, Object.assign({}, o, { density: 0.0012, restitution: 0.06 }));
  else if (kind === 'tart') b = Bodies.rectangle(x, y, 40, 24, Object.assign({}, o, { chamfer: { radius: 6 }, density: 0.0016 }));
  else if (kind === 'toast') b = Bodies.rectangle(x, y, 44, 44, Object.assign({}, o, { chamfer: { radius: 7 }, density: 0.0012 }));
  else b = Bodies.fromVertices(x, y, [[{ x: -22, y: -19 }, { x: 22, y: -19 }, { x: 18, y: 20 }, { x: -18, y: 20 }]],
    Object.assign({}, o, { density: 0.0014, restitution: 0 }));
  b.kind = kind; b.caught = false; b.fill = 1; b.landX = x; b.landAt = 0;
  return b;
}
function stackTop() {
  let top = T.plateY - 5;
  for (const b of items) if (b.caught) top = Math.min(top, b.bounds.min.y);
  return top;
}
function stepsToFall(d) {
  let v = 0, p = 0, n = 0;
  while (p < d && n < 600) { v = v * (1 - T.airFriction) + GA; p += v; n++; }
  return n;
}
function interval() {
  return T.spawnStart + (T.spawnMin - T.spawnStart) * Math.min(1, elapsed / T.rampSeconds);
}
/* Smart spawn: only drop where the tray can still get to in time,
   including the dishes that are already in the air. */
function spawn() {
  const kind = pickKind();
  const y = -50;
  const d = Math.max(80, stackTop() - y - 20);
  const n = stepsToFall(d);
  const loss = (T.maxSpeed * T.maxSpeed) / (2 * T.accel);
  const reach = Math.max(60, (T.maxSpeed * n - loss) * 0.8);
  const px = plate.position.x;
  const lo = Math.max(30, px - reach), hi = Math.min(W - 30, px + reach);
  const landAt = stepCount + n;
  let x = px;
  for (let k = 0; k < 10; k++) {
    const cx = lo + Math.random() * (hi - lo);
    let ok = true;
    for (const j of items) {
      if (j.caught || j.landAt <= stepCount) continue;
      const allow = 0.8 * T.maxSpeed * Math.abs(landAt - j.landAt) + T.plateW / 2 - 26;
      if (Math.abs(cx - j.landX) > allow) { ok = false; break; }
    }
    x = cx;
    if (ok) break;
  }
  const b = make(kind, x, y);
  b.landX = x; b.landAt = landAt;
  Body.setVelocity(b, { x: (Math.random() - 0.5) * 0.6, y: 0 });
  Body.setAngularVelocity(b, (Math.random() - 0.5) * 0.03);
  items.push(b);
  spawned++;
  Composite.add(world, b);
}

/* ---------- Catching, spilling, sticking ---------- */
function pop(text, x, y, color, size) { pops.push({ text, x, y, color, size: size || 16, life: 50 }); }
function catchItem(b) {
  b.caught = true;
  pop('+1', b.position.x, b.position.y - 30, '#e0786d', 14);
}
function spill(b, amt, burst) {
  const take = Math.min(b.fill, amt);
  if (take <= 0) return;
  b.fill -= take;
  const n = take * 40;
  let whole = Math.floor(n);
  if (Math.random() < n - whole) whole++;
  const a = b.angle;
  const dx = Math.sin(a), dy = -Math.cos(a);
  const rx = b.position.x + dx * 19, ry = b.position.y + dy * 19;
  for (let i = 0; i < whole; i++) {
    drops.push({
      x: rx, y: ry,
      vx: b.velocity.x * 0.5 + dx * 1.5 + (Math.random() - 0.5) * 2,
      vy: b.velocity.y * 0.3 + dy * 1.5 + (Math.random() - 0.5) * 1.5 - (burst ? Math.random() * 3 : 0),
      life: 100, r: 2 + Math.random() * 1.5
    });
  }
}
function handlePairs(e, isStart) {
  for (const p of e.pairs) {
    const a = p.bodyA.parent, b = p.bodyB.parent;
    if (a === b) continue;
    const ia = a.label === 'item' ? a : null;
    const ib = b.label === 'item' ? b : null;
    if (ia && !ia.caught && (b === plate || (ib && ib.caught))) catchItem(ia);
    if (ib && !ib.caught && (a === plate || (ia && ia.caught))) catchItem(ib);
    if (ia && ib && ia.caught && ib.caught) queueWeld(ia, ib);
    if (isStart) {
      [[ia, b], [ib, a]].forEach(function (pair) {
        const it = pair[0], other = pair[1];
        if (it && it.kind === 'tea' && it.fill > 0) {
          const rv = Vector.magnitude(Vector.sub(it.velocity, other.velocity));
          if (rv > T.teaSplashSpeed) spill(it, Math.min(1, (rv - T.teaSplashSpeed) / 6) * 0.2, true);
        }
      });
    }
  }
}
Events.on(engine, 'collisionStart', function (e) { handlePairs(e, true); });
Events.on(engine, 'collisionActive', function (e) { handlePairs(e, false); });

/* Sticky dishes: two touching dishes on the tray get welded with a pair of stiff constraints.
   One constraint holds the distance, the second (offset sideways) holds the angle. */
const welded = new Set();
const pendingWelds = [];
function queueWeld(a, b) {
  const k = a.id < b.id ? a.id + '-' + b.id : b.id + '-' + a.id;
  if (welded.has(k)) return;
  welded.add(k);
  pendingWelds.push([a, b]);
}
function applyWelds() {
  while (pendingWelds.length) {
    const p = pendingWelds.pop(), a = p[0], b = p[1];
    if (a.removed || b.removed) continue;
    const dx = b.position.x - a.position.x, dy = b.position.y - a.position.y;
    const d = Math.hypot(dx, dy) || 1;

/* ---------- Simulation step ---------- */
function movePlate() {
  const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  const target = dir * T.maxSpeed;
  const rate = dir === 0 ? T.decel : T.accel;
  if (pvx < target) pvx = Math.min(target, pvx + rate);
  else if (pvx > target) pvx = Math.max(target, pvx - rate);
  let nx = plate.position.x + pvx;
  const lo = T.plateW / 2 + 6, hi = W - T.plateW / 2 - 6;
  if (nx < lo) { nx = lo; pvx = 0; } else if (nx > hi) { nx = hi; pvx = 0; }
  Body.setPosition(plate, { x: nx, y: plateY0 });
  Body.setVelocity(plate, { x: pvx, y: 0 });
  Body.setAngle(plate, 0);
}
function step() {
  stepCount++;
  movePlate();
  if (state === 'play') {
    elapsed += 1 / 60;
    if (spawned < T.total) {
      spawnT -= 1;
      if (spawnT <= 0) { spawn(); spawnT = interval() * 60 * (0.85 + Math.random() * 0.3); sinceLast = 0; }
    } else {
      sinceLast++;
      let air = false;
      for (const b of items) if (!b.caught) { air = true; break; }
      if (air) settleT = 0; else settleT++;
      if (settleT > 150 || sinceLast > 60 * 20) finish();
    }
  }
  Engine.update(engine, DT);
  applyWelds();
  for (const b of items) {
    if (!b.caught) continue;
    Body.setAngularVelocity(b, b.angularVelocity * 0.8);
    // Grip assist: dishes resting on the tray mostly travel with it instead of sliding off
    if (Math.abs(b.velocity.y) < 3 && Math.abs(b.position.x - plate.position.x) < T.plateW / 2 + 30) {
      Body.setVelocity(b, { x: pvx + (b.velocity.x - pvx) * 0.8, y: b.velocity.y });
    }
  }
  for (const b of items) {
    if (b.kind === 'tea' && b.fill > 0) {
      let a = b.angle % (2 * Math.PI);
      if (a > Math.PI) a -= 2 * Math.PI;
      if (a < -Math.PI) a += 2 * Math.PI;
      const tilt = Math.abs(a);
      if (tilt > T.teaTilt) spill(b, 0.003 + 0.007 * Math.min(1, tilt - T.teaTilt), false);
    }
  }
  for (let i = items.length - 1; i >= 0; i--) {
    const b = items[i];
    if (b.position.y > H + 70 || b.position.x < -90 || b.position.x > W + 90) {
      removeItem(b);
      items.splice(i, 1);
    }
  }
  const top = T.plateY - 5;
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i];
    d.vy += 0.25; d.x += d.vx; d.y += d.vy; d.life--;
    if (d.vy > 0 && d.y >= top - 1 && d.y < top + 8 && Math.abs(d.x - plate.position.x) < T.plateW / 2 - 4) {
      puddles.push({ off: d.x - plate.position.x, r: d.r, life: 240 });
      drops.splice(i, 1);
    } else if (d.y > H + 20 || d.life <= 0) drops.splice(i, 1);
  }
  for (let i = puddles.length - 1; i >= 0; i--) if (--puddles[i].life <= 0) puddles.splice(i, 1);
  for (let i = pops.length - 1; i >= 0; i--) { pops[i].y -= 0.6; if (--pops[i].life <= 0) pops.splice(i, 1); }
}

    const nxp = ST.x0 + 8 + u * (ST.x1 - ST.x0 - 12);
    const feet = treadTop(stepIndex(nxp));
    person(nxp, feet - 38, { r: 13, hair: '#cfc6dd', bun: true, shirt: '#fbd9c4', legs: true, pants: '#a9b8d8', eyes: 'dot', mouth: 'smile', look: 2 });
    const bagx = nxp + 14, bagy = feet - 22 + ((f % 2) ? 1 : 0);
    ctx.strokeStyle = C.out; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(nxp + 9, feet - 26); ctx.lineTo(bagx, bagy); ctx.stroke();
    ctx.save(); rr(bagx - 7, bagy, 14, 16, 2); ctx.clip();
    ['#f6a6b4', '#fffaf3', '#a9cfe8', '#fffaf3', '#f6a6b4'].forEach(function (c, i) { ctx.fillStyle = c; ctx.fillRect(bagx - 7 + i * 3, bagy, 3.2, 16); });
    ctx.restore();
    ctx.strokeStyle = C.out; ctx.lineWidth = 1.5; rr(bagx - 7, bagy, 14, 16, 2); ctx.stroke();
  }
}

/* ---------- Drawing ---------- */
function drawHUD() {
  let onTray = 0;
  for (const b of items) if (b.caught) onTray++;
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left'; ctx.font = F('700', 24);
  outlined('On tray ' + onTray, 16, 98, C.ink);
  ctx.textAlign = 'right';
  outlined((T.total - spawned) + ' left', W - 16, 98, '#d9776c');
  ctx.textAlign = 'left';
}
function draw(t) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.drawImage(bgBack.c, 0, 0, W, H);
  drawAnim(t);
  ctx.drawImage(bgFront.c, 0, 0, W, H);
  if (state === 'title') { drawTitle(t); return; }

  drawSticker(stkGame, ctx, function () {
    drawWaiter(look, plate.position.x, H - 16, { pvx: pvx, t: t, lean: Math.max(-0.12, Math.min(0.12, pvx * 0.025)) });
    drawTray(plate.position.x, T.plateY);
    for (const p of puddles) {
      ctx.globalAlpha = Math.min(1, p.life / 80) * 0.85;
      ctx.fillStyle = C.tea;
      ctx.beginPath(); ctx.ellipse(plate.position.x + p.off, T.plateY - 5, p.r * 1.8, p.r * 0.8, 0, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
    }
    for (const b of items) {
      const mood = b.caught ? ((b.kind === 'tea' && b.fill < 0.35) ? 'sad' : 'happy') : 'o';
      drawItem(b.kind, b.position.x, b.position.y, b.angle, b.fill, undefined, mood);
    }
    ctx.fillStyle = C.tea;
    for (const d of drops) { circ(d.x, d.y, d.r); ctx.fill(); }
  });

  ctx.textAlign = 'center';
  for (const p of pops) {
    ctx.globalAlpha = Math.min(1, p.life / 30);
    ctx.font = F('700', p.size);
    outlined(p.text, p.x, p.y, p.color);
    ctx.globalAlpha = 1;
  }
  drawHUD();

  if (state === 'over') {
    ctx.fillStyle = 'rgba(255,247,249,.86)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.font = F('700', 30); outlined('Round over', W / 2, 250, '#d9776c');
    ctx.font = F('700', 58); outlined(finalCount + ' of ' + T.total, W / 2, 322, C.ink);
    ctx.font = F('600', 19); outlined('stayed on the tray', W / 2, 352, C.ink);
    outlined('Best ' + best, W / 2, 392, '#8a7a88');
    ctx.font = F('600', 17);
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(performance.now() / 300);
    outlined('Tap or press any key to play again', W / 2, 452, '#d9776c');
    ctx.globalAlpha = 1;
    ctx.font = F('500', 14); outlined('Use the Waiter button to restyle', W / 2, 480, '#8a7a88');
  }
}
/* ---------- Title screen ---------- */
const BTN = { start: { x: W / 2 - 120, y: 352, w: 240, h: 64 }, dress: { x: W / 2 - 100, y: 428, w: 200, h: 40 } };
function bouncy(text, cx, y, t, seed) {
  let total = 0;
  const ws = [];
  for (const ch of text) { const w = ctx.measureText(ch).width; ws.push(w); total += w; }
  let x = cx - total / 2, i = 0;
  const prevAlign = ctx.textAlign;
  ctx.textAlign = 'left';
  for (const ch of text) {
    const dy = Math.sin(t * 2.6 + i * 0.55 + seed) * 4;
    ctx.lineWidth = 9; ctx.strokeStyle = '#fffaf5'; ctx.lineJoin = 'round';
    ctx.strokeText(ch, x, y + dy);
    ctx.lineWidth = 5; ctx.strokeStyle = '#b4554c';
    ctx.strokeText(ch, x, y + dy);
    ctx.fillStyle = '#f08a7e'; ctx.fillText(ch, x, y + dy);
    x += ws[i]; i++;
  }
  ctx.textAlign = prevAlign;
}
function pill(r, fill, edge, label, size, color, pulse) {
  const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
  ctx.save();
  ctx.translate(cx, cy); ctx.scale(pulse, pulse); ctx.translate(-cx, -cy);
  ctx.fillStyle = edge; rr(r.x, r.y + 5, r.w, r.h, r.h / 2); ctx.fill();
  ctx.fillStyle = fill; rr(r.x, r.y, r.w, r.h, r.h / 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.35)'; rr(r.x + 14, r.y + 6, r.w - 28, 6, 3); ctx.fill();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = F('700', size);
  ctx.fillStyle = color; ctx.fillText(label, cx, cy + 1);
  ctx.textBaseline = 'alphabetic';
  ctx.restore();
}
const DECO = [['bun', 58, 0.0, 30], ['tea', 424, 0.31, 26], ['tart', 100, 0.57, 34], ['toast', 384, 0.83, 28], ['tea', 36, 0.45, 22], ['bun', 446, 0.12, 24]];
function drawTitle(t) {
  ctx.fillStyle = 'rgba(255,247,249,.66)'; ctx.fillRect(0, 0, W, H);
  // dishes drifting down the sides, like a title-screen attract mode
  DECO.forEach(function (d, i) {
    const span = H + 120;
    const y = ((t * d[3] + d[2] * span) % span) - 60;
    drawItem(d[0], d[1], y, Math.sin(t * 0.9 + i) * 0.5, 1, 0.9, 'happy');
  });
  ctx.textAlign = 'center';
  ctx.font = FCJK('700', 24);
  if (ctx.letterSpacing !== undefined) ctx.letterSpacing = '12px';
  outlined('茶餐廳', W / 2 + 6, 136, '#d9776c');
  if (ctx.letterSpacing !== undefined) ctx.letterSpacing = '0px';
  ctx.font = F('700', 76); bouncy('Cha Chaan', W / 2, 214, t, 0);
  ctx.font = F('700', 92); bouncy('Catch!', W / 2, 296, t, 1.4);
  ctx.textAlign = 'center';
  ctx.font = F('600', 16); outlined('50 dishes fall. Keep them on your tray.', W / 2, 330, C.ink);
  const pulse = 1 + 0.025 * Math.sin(t * 4);
  pill(BTN.start, '#e9776b', '#b4554c', 'START', 34, '#fff', pulse);
  pill(BTN.dress, '#fff3f0', '#e8cfd0', 'Dress your waiter', 16, C.ink, 1);
  if (best > 0) { ctx.textAlign = 'center'; ctx.font = F('700', 15); outlined('Best ' + best + ' of ' + T.total, W / 2, 486, '#8a7a88'); }
  // the waiter, bobbing with a couple of dishes on the tray
  const bob = Math.sin(t * 3) * 1.5;
  drawSticker(stkGame, ctx, function () {
    drawWaiter(look, W / 2, H - 16, { pvx: 0, t: t, lean: 0, bob: bob });
    drawTray(W / 2, T.plateY);
    drawItem('bun', W / 2 - 52, T.plateY - 5 - 23, 0, 1, 1, 'happy');
    drawItem('tea', W / 2 + 40, T.plateY - 5 - 20, 0, 1, 1, 'happy');
  });
}
function drawPreview(t) {
  const prev = ctx;
  ctx = pctx; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const g = ctx.createLinearGradient(0, 0, 0, PVH);
  g.addColorStop(0, '#dcefea'); g.addColorStop(1, '#f7e7e1');
  ctx.fillStyle = g; ctx.fillRect(0, 0, PVW, PVH);
  ctx.fillStyle = 'rgba(110,98,112,.12)'; ctx.beginPath(); ctx.ellipse(PVW / 2, 226, 58, 8, 0, 0, 7); ctx.fill();
  const bob = Math.sin(t * 3) * 1.5;
  const feet = 224;
  const trayY = feet - 164 + bob;
  drawSticker(stkPrev, pctx, function () {
    drawWaiter(look, PVW / 2, feet, { pvx: 0, t: t, lean: 0, bob: bob });
    drawTray(PVW / 2, trayY);
    drawItem('bun', PVW / 2 - 52, trayY - 5 - 23, 0, 1, 1, 'happy');
    drawItem('tea', PVW / 2 + 40, trayY - 5 - 20, 0, 1, 1, 'happy');
  });
  ctx = prev;
}

/* ---------- Waiter designer UI ---------- */
(function buildMaker() {
  const host = document.getElementById('rows');
  const tabsEl = document.getElementById('tabs');
  const GROUPS = [['Body', ['gender', 'hair']], ['Face', ['expr']], ['Outfit', ['outfit', 'hat']], ['Colour', ['color', 'pants']]];
  let cur = 0;
  function refresh() {
    document.querySelectorAll('.chip, .sw').forEach(function (c) {
      c.setAttribute('aria-pressed', String(look[c.dataset.key] === c.dataset.val));
    });
  }
  function showTab(i) {
    cur = i;
    Array.prototype.forEach.call(tabsEl.children, function (t, j) { t.setAttribute('aria-selected', String(j === i)); });
    host.innerHTML = '';
    host.scrollTop = 0;
    const keys = GROUPS[i][1];
    keys.forEach(function (key) {
      const row = document.createElement('div'); row.className = 'row';
      if (keys.length > 1) { const lab = document.createElement('div'); lab.className = 'lab'; lab.textContent = LABELS[key]; row.appendChild(lab); }
      const chips = document.createElement('div'); chips.className = 'chips';
      const isSwatch = !!SWATCHES[key];
      (isSwatch ? SWATCHES[key] : OPTS[key]).forEach(function (o) {
        const b = document.createElement('button');
        b.type = 'button';
        b.dataset.key = key; b.dataset.val = o[0];
        if (isSwatch) { b.className = 'sw'; b.style.background = o[2]; b.setAttribute('aria-label', o[1]); b.title = o[1]; }
        else { b.className = 'chip'; b.textContent = o[1]; }
        b.setAttribute('aria-pressed', String(look[key] === o[0]));
        b.addEventListener('click', function () { look[key] = o[0]; saveLook(); refresh(); });
        chips.appendChild(b);
      });
      row.appendChild(chips); host.appendChild(row);
    });
  }
  GROUPS.forEach(function (g, i) {
    const t = document.createElement('button');
    t.type = 'button'; t.className = 'tab'; t.setAttribute('role', 'tab'); t.textContent = g[0];
    t.addEventListener('click', function () { showTab(i); });
    tabsEl.appendChild(t);
  });
  showTab(0);
  document.getElementById('shuffle').addEventListener('click', function () {
    ROW_ORDER.forEach(function (k) {
      const list = OPTS[k] || SWATCHES[k];
      look[k] = list[Math.floor(Math.random() * list.length)][0];
    });
    saveLook(); refresh();
  });
})();
document.getElementById('go').addEventListener('click', function () { start(); });
document.getElementById('back').addEventListener('click', function () { toTitle(); });
btnW.addEventListener('click', function () { openMaker(); });

/* ---------- Input ---------- */
function setKey(code, down) {
  if (code === 'ArrowLeft' || code === 'KeyA') keys.left = down;
  else if (code === 'ArrowRight' || code === 'KeyD') keys.right = down;
}
window.addEventListener('keydown', function (e) {
  if (state === 'create') return;
  if (state === 'title' && e.code === 'KeyD') { openMaker(); return; }
  if (['ArrowLeft', 'ArrowRight', 'Space', 'ArrowUp', 'ArrowDown'].indexOf(e.code) >= 0) e.preventDefault();
  if (e.repeat) return;
  if (['ShiftLeft', 'ShiftRight', 'ControlLeft', 'ControlRight', 'AltLeft', 'AltRight', 'MetaLeft', 'MetaRight'].indexOf(e.code) >= 0) return;
  if (state === 'over' || state === 'title') { anyStart(); return; }
  setKey(e.code, true);
});
window.addEventListener('keyup', function (e) { setKey(e.code, false); });
window.addEventListener('blur', function () { keys.left = false; keys.right = false; });
cv.addEventListener('pointerdown', function (e) {
  if (state === 'title') {
    const r = cv.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
    const d = BTN.dress;
    if (x >= d.x && x <= d.x + d.w && y >= d.y && y <= d.y + d.h + 6) { openMaker(); return; }
  }
  anyStart();
});

function hold(id, key) {
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    el.classList.add('on');
    if (state === 'create') return;
    if (state === 'over' || state === 'title') { anyStart(); return; }
    keys[key] = true;
  });
  const up = function () { el.classList.remove('on'); keys[key] = false; };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('lostpointercapture', up);
}
hold('bL', 'left');
hold('bR', 'right');
document.getElementById('pad').addEventListener('contextmenu', function (e) { e.preventDefault(); });

/* ---------- Loop ---------- */
buildBg();
try {
  Promise.all([
    document.fonts.load('700 24px "Fredoka"'),
    document.fonts.load('500 14px "Fredoka"')
  ]).then(function () { buildBg(); });
} catch (e) {}
makerEl.hidden = true;
titleAt = performance.now();
setState('title');
let last = performance.now(), acc = 0, firstFrame = true;
function frame(now) {
  if (firstFrame) { fit(); firstFrame = false; }
  acc += Math.min(100, now - last); last = now;
  let n = 0;
  while (acc >= DT && n < 4) { step(); acc -= DT; n++; }
  if (n === 4) acc = 0;
  const t = now / 1000;
  draw(t);
  if (state === 'create') drawPreview(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
